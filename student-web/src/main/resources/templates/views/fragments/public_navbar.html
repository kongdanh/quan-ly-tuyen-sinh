<nav th:fragment="navbar(activeTab)" class="nav-public" xmlns:th="http://www.thymeleaf.org" style="background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); padding: 12px 0; box-shadow: 0 4px 20px rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 1000; transition: all 0.3s ease;">

                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" /></svg>

            <a th:href="@{/thisinh/tracuu/dgnl}" class="nav-link-custom" th:classappend="${activeTab == 'tracuu'} ? 'active' : ''">Tra cứu</a>

                    <a th:href="@{/register}" class="btn-premium btn-register">Đăng ký</a>
