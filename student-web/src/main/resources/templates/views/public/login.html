<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Cổng thông tin Tuyển sinh SGU</title>
    <link rel="stylesheet" th:href="@{/assets/css/global.css}">
    <link rel="stylesheet" th:href="@{/assets/css/login.css}">

</head>
<body>
    <div class="top-nav">
        <a th:href="@{/}" class="back-link">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
            Trở về Trang chủ
        </a>
    </div>

    <div class="login-container">
        <div class="logo-placeholder">
            <img th:src="@{/assets/images/icon_school.webp}" alt="SGU Logo" style="width: 100%; height: 100%; border-radius: 50%;">
        </div>
        <h2>Đăng nhập Hệ thống</h2>
        <p class="subtitle">Nhập thông tin tài khoản để truy cập hồ sơ xét tuyển của bạn.</p>
        
        <div class="alert" th:if="${error != null}">
            <strong style="font-weight: 600;">Lỗi:</strong> <span th:text="${error}">Thông báo lỗi</span>
        </div>

        <form th:action="@{/login}" method="POST" class="login-form">
            <div class="form-group">
                <label for="cccd">Số CCCD / Mã định danh</label>
                <input type="text" id="cccd" name="cccd" placeholder="Nhập 12 số CCCD của bạn" required autofocus>
            </div>
            
            <div class="form-group">
                <label for="password">Mật khẩu</label>
                <div class="password-box">
                    <input type="password" id="password" name="password" placeholder="Nhập mật khẩu" required>
                    <button type="button" class="toggle-btn" onclick="togglePass()" title="Hiện/Ẩn mật khẩu">
                        <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                    </button>
                </div>
            </div>
            
            <button type="submit" id="submitBtn">Đăng Nhập</button>
        </form>
        
        <div class="register-link">
            Chưa có tài khoản xét tuyển? <a th:href="@{/register}">Tạo tài khoản ngay</a>
        </div>
        
        <div class="note-box" style="margin-top: 16px; font-size: 12px; background: #f8fafc; padding: 12px; border-radius: 8px;">
            Mật khẩu mặc định (nếu được Admin cấp) là <strong>ngày sinh</strong> của bạn theo định dạng: <strong>dd/mm/yyyy</strong>
        </div>
    </div>

    <script th:src="@{/assets/js/auth.js}"></script>
</body>
</html>
