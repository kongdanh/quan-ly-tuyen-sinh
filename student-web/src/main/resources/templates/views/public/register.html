<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản - Cổng thông tin Tuyển sinh SGU</title>
    
    <link rel="stylesheet" th:href="@{/assets/css/global.css}">
    <link rel="stylesheet" th:href="@{/assets/css/login.css}">
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body>
    <div class="top-nav">
        <a th:href="@{/}" class="back-link">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
            Trở về Trang chủ
        </a>
    </div>

    <div class="login-container">
        <h2>Đăng Ký Hồ Sơ</h2>
        <p class="subtitle">Vui lòng điền chính xác thông tin để khởi tạo hồ sơ xét tuyển.</p>
        
        <div class="alert" th:if="${error != null}">
            <strong style="font-weight:600;">Lỗi:</strong> <span th:text="${error}"></span>
        </div>

        <form th:action="@{/register}" method="POST" class="login-form">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                <div class="form-group">
                    <label>Họ và chữ đệm</label>
                    <input type="text" name="ho" placeholder="VD: Nguyễn Văn" required>
                </div>
                <div class="form-group">
                    <label>Tên</label>
                    <input type="text" name="ten" placeholder="VD: An" required>
                </div>
            </div>

            <div class="form-group">
                <label>CCCD / Mã định danh</label>
                <input type="text" name="cccd" placeholder="Nhập đủ 12 số CCCD" pattern="[0-9]{12}" title="Vui lòng nhập đúng 12 số CCCD" required>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                <div class="form-group">
                    <label>Ngày sinh</label>
                    <input type="text" name="ngaySinh" placeholder="dd/mm/yyyy" required>
                </div>
                <div class="form-group">
                    <label>Giới tính</label>
                    <select name="gioiTinh" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ddd;">
                        <option value="1">Nam</option>
                        <option value="0">Nữ</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Nơi sinh (Tỉnh/Thành)</label>
                <input type="text" name="noiSinh" placeholder="VD: TP. Hồ Chí Minh" required>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                <div class="form-group">
                    <label>Email xác thực</label>
                    <input type="email" name="email" placeholder="email@gmail.com" required>
                </div>
                <div class="form-group">
                    <label>Số điện thoại</label>
                    <input type="text" name="dienThoai" placeholder="090..." required>
                </div>
            </div>

            <div class="form-group">
                <label>Mật khẩu đăng nhập</label>
                <input type="password" name="password" placeholder="Tạo mật khẩu (Ít nhất 6 ký tự)" minlength="6" required>
            </div>

            <div style="margin-top: 10px; margin-bottom: 20px; display: flex; justify-content: center;">
                <div class="g-recaptcha" data-sitekey="6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI"></div>
            </div>
            
            <button type="submit" id="submitBtn">Tiếp tục & Xác thực Email</button>
        </form>
        
        <div class="register-link">
            Đã có tài khoản xét tuyển? <a th:href="@{/login}">Đăng nhập ngay</a>
        </div>
    </div>
</body>
</html>
